<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body{
            font-family:sans-serif;
            padding:20px;
        }

        input{
            width:300px;
            padding:6px;
            margin-bottom:10px;
        }

        button{
            padding:8px 16px;
        }
    </style>
</head>

<body>

<h2>資格編集</h2>

<form method="post">

    <div>
        <label>社員名</label><br>
        <input
            type="text"
            name="employee_name"
            value="{{ license.employee_name }}"
        >
    </div>

    <div>
        <label>資格名</label><br>
        <input
            type="text"
            name="license_name"
            value="{{ license.license_name }}"
        >
    </div>

    <div>
        <label>期限</label><br>
        <input
            type="date"
            name="expiry_date"
            value="{{ license.expiry_date }}"
        >
    </div>

    <div>
        <label>通知日数</label><br>
        <input
            type="number"
            name="notify_days_before"
            value="{{ license.notify_days_before }}"
        >
    </div>

    <button type="submit">保存</button>

</form>

</body>
</html>
