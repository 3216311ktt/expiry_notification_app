<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: sans-serif;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px 14px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f0f0f0;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .danger {
            color: red;
            font-weight: bold;
        }

        .action-cell {
            white-space: nowrap;
        }

        .action-btn {
            display: inline-block;

            padding: 5px 10px;
            margin-right: 6px;

            border: 1px solid #ccc;
            border-radius: 4px;

            background: #f5f5f5;

            text-decoration: none;
            color: black;

            font-size: 14px;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #e9e9e9;
        }

        .delete-btn {
            color: red;
            border-color: #ffb3b3;
            background: #fff5f5;
        }

        .delete-btn:hover {
            background: #ffe5e5;
        }

    </style>

</head>

<body>

<h2>資格一覧</h2>

<p>
    <a href="/add">資格を追加</a>
</p>

<table>

    <tr>
        <th style="width:22%;">社員名</th>
        <th style="width:34%;">資格名</th>
        <th style="width:22%;">期限</th>
        <th style="width:18%;">状態</th>
        <th style="width:18%;">操作</th>
    </tr>

    {% for l in alert_licenses %}

        <tr class="danger">

            <td>{{ l.employee_name }}</td>

            <td>{{ l.license_name }}</td>

            <td>{{ l.expiry_date }}</td>

            <td>期限間近</td>

            <td class="action-cell">

                <a href="/edit/{{ l.id }}"
                   class="action-btn">

                    編集

                </a>

                <form action="/delete/{{ l.id }}"
                      method="POST"
                      style="display:inline;">

                    <button type="submit"
                            class="action-btn delete-btn"
                            onclick="return confirm('削除しますか？')">

                        削除

                    </button>

                </form>

            </td>

        </tr>

    {% endfor %}

    {% for l in normal_licenses %}

        <tr>

            <td>{{ l.employee_name }}</td>

            <td>{{ l.license_name }}</td>

            <td>{{ l.expiry_date }}</td>

            <td>正常</td>

            <td class="action-cell">

                <a href="/edit/{{ l.id }}"
                   class="action-btn">

                    編集

                </a>

                <form action="/delete/{{ l.id }}"
                      method="POST"
                      style="display:inline;">

                    <button type="submit"
                            class="action-btn delete-btn"
                            onclick="return confirm('削除しますか？')">

                        削除

                    </button>

                </form>

            </td>

        </tr>

    {% endfor %}

</table>

</body>

</html>
